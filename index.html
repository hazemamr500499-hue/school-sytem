                        </div>
                    </div>
                `;
                return;
            }

            app.innerHTML = `
                <button class="btn-back" onclick="goBack()"><span>→</span> العودة للخلف</button>

                <div class="section-header">
                    <span>🔍 نتائج البحث</span>
                    <span class="count-badge">${results.length}</span>
                </div>

                ${results.map(s => {
                    const score = s.behaviorScore || 100;
                    return `
                        <div class="student-item" onclick="navigateToReport('${s.id}')">
                            <div class="student-info">
                                <span class="student-name">${s.name}</span>
                                <span style="color: ${getScoreColor(score)}; font-weight: bold;">
                                    ${score}%
                                </span>
                            </div>
                            <div class="student-class-label">📍 ${s.class} — ${s.grade}</div>
                            <div style="margin-top: 10px;">
                                ${renderProgressBar(score)}
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        };

        // ============================================================
        // صفحة اللوائح والمخالفات
        // ============================================================
        function navigateToViolations() {
            history.pushState({ view: 'violations' }, '', '#violations');
            renderViolationsView();
        }
        window.navigateToViolations = navigateToViolations;

        function renderViolationsView() {
            currentView = 'violations';
            const app = document.getElementById('app');
            app.innerHTML = `
                <button class="btn-back" onclick="goBack()">
                    <span>→</span> العودة للخلف
                </button>

                <div class="violations-table">
                    <h2>📋 قائمة المخالفات واللوائح السلوكية</h2>
                    <p class="violations-subtitle">
                        كل مخالفة يترتب عليها خصم من درجة السلوك كما هو موضح
                    </p>
                    ${VIOLATIONS_LIST.map(v => `
                        <div class="violation-row">
                            <span class="violation-label">${v.label}</span>
                            <span class="violation-percent ${v.percent >= 50 ? 'high' : ''}">
                                -${v.percent}%
                            </span>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        window.renderViolationsView = renderViolationsView;

        // ============================================================
        // الجدول الأسبوعي
        // ============================================================
        window.navigateToSchedule = function(className) {
            history.pushState({ view: 'schedule', className }, '', `#schedule-${className}`);
            renderScheduleView(className);
        };

        function renderScheduleView(className) {
            currentView = 'schedule';
            const app = document.getElementById('app');

            const classId = classIdFromName(className);
            const scheduleDoc = schedulesCache[classId] || {};
            const weeklySchedule = scheduleDoc.weeklySchedule || {};

            app.innerHTML = `
                <button class="btn-back" onclick="goBack()">
                    <span>→</span> العودة للخلف
                </button>

                <div class="report-card">
                    <h2>📅 جدول الحصص</h2>
                    <p style="color: #64748b; margin-top: 5px; font-size: 13px;">${className}</p>

                    ${Object.keys(weeklySchedule).length > 0
                        ? `<div style="margin-top: 20px;">${renderScheduleTable(weeklySchedule)}</div>`
                        : `
                            <div class="empty-state" style="padding: 35px; margin-top: 15px;">
                                <span class="empty-icon">📅</span>
                                <div class="empty-title">لا يوجد جدول بعد</div>
                                <div class="empty-desc">
                                    لم يتم إضافة الجدول لهذا الفصل حتى الآن<br>
                                    تابع التحديثات للحصول على الجدول الأسبوعي
                                </div>
                            </div>
                        `
                    }
                </div>
            `;
        }

        function renderScheduleTable(weeklySchedule) {
            let html = '';
            let hasAnyLesson = false;

            WEEK_DAYS.forEach(day => {
                const daySchedule = weeklySchedule[day];
                if (daySchedule && Object.keys(daySchedule).length > 0) {
                    hasAnyLesson = true;
                    html += `
                        <div class="schedule-day-block">
                            <div class="schedule-day-title">📆 ${day}</div>
                            ${Object.keys(daySchedule).sort((a, b) => a - b).map(slot => {
                                const lesson = daySchedule[slot];
                                const subject = lesson.subject || lesson.name || lesson;
                                const teacher = lesson.teacher || '';
                                return `
                                    <div class="schedule-slot">
                                        <strong>الحصة ${slot}</strong>
                                        <span class="subject">${subject}</span>
                                        ${teacher ? `<span class="teacher">👤 ${teacher}</span>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }
            });

            return hasAnyLesson ? html : `
                <div class="empty-state" style="padding: 25px;">
                    <div class="empty-desc">لم يتم إضافة حصص بعد</div>
                </div>
            `;
        }

        // ============================================================
        // التنبيهات
        // ============================================================
        window.navigateToAlerts = function(className) {
            history.pushState({ view: 'alerts', className }, '', `#alerts-${className}`);
            renderAlertsView(className);
        };

        function renderAlertsView(className) {
            currentView = 'alerts';
            const app = document.getElementById('app');

            const classAlerts = alertsCache
                .filter(a => a.className === className)
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            const classStudents = studentsCache.filter(s => s.class === className);
            const allNotes = [];
            classStudents.forEach(student => {
                if (student.behaviorNotes && student.behaviorNotes.length > 0) {
                    student.behaviorNotes.forEach(note => {
                        allNotes.push({ student: student.name, note });
                    });
                }
            });

            app.innerHTML = `
                <button class="btn-back" onclick="goBack()">
                    <span>→</span> العودة للخلف
                </button>

                <div class="report-card">
                    <h2>🔔 التنبيهات</h2>
                    <p style="color: #64748b; margin-top: 5px; font-size: 13px;">${className}</p>

                    ${(classAlerts.length > 0 || allNotes.length > 0) ? `
                        ${classAlerts.length > 0 ? `
                            <div style="margin-top: 20px; text-align: right;">
                                <h4 style="color: #1e3a8a; margin-bottom: 12px;">📢 تنبيهات عامة:</h4>
                                <div class="alerts-list">
                                    ${classAlerts.map(a => `
                                        <div class="alert-item">
                                            <div class="a-head">
                                                <span>🔔 تنبيه</span>
                                                <span class="a-time">
                                                    ${a.createdAt ? new Date(a.createdAt).toLocaleString('ar-EG') : ''}
                                                </span>
                                            </div>
                                            <div class="a-body">${(a.text || '').replace(/\n/g, '<br>')}</div>
                                            ${a.image ? `<img src="${a.image}" class="a-img" onclick="window.open('${a.image}', '_blank')">` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${allNotes.length > 0 ? `
                            <div style="margin-top: 25px; text-align: right;">
                                <h4 style="color: #1e3a8a; margin-bottom: 12px;">📝 ملاحظات الطلاب:</h4>
                                <ul class="notes-list">
                                    ${allNotes.map(item => `
                                        <li><strong>${item.student}:</strong> ${item.note}</li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    ` : `
                        <div class="empty-state" style="padding: 35px; margin-top: 15px;">
                            <span class="empty-icon">🔔</span>
                            <div class="empty-title">لا توجد تنبيهات</div>
                            <div class="empty-desc">جميع الطلاب في حالة سلوك جيدة</div>
                        </div>
                    `}
                </div>
            `;
        }

        // ============================================================
        // صفحة الشكاوى
        // ============================================================
        window.navigateToComplaint = function() {
            history.pushState({ view: 'complaint' }, '', '#complaint');
            renderComplaintView();
        };

        function renderComplaintView() {
            currentView = 'complaint';
            const app = document.getElementById('app');

            complaintStudent = null;
            complaintAgainst = null;

            app.innerHTML = `
                <button class="btn-back" onclick="goBack()">
                    <span>→</span> العودة للخلف
                </button>

                <div class="complaint-card">
                    <h2 style="color: #1e3a8a; text-align: center; margin-bottom: 18px; font-size: 19px;">
                        📢 شكوى في طالب آخر
                    </h2>

                    <div class="complaint-intro">
                        ⚠️ بعد إملاء هذه البيانات سيتم تحويل الشكوى للخصائي الاجتماعي
                    </div>

                    <div class="complaint-group">
                        <label>🔎 ابحث عن اسمك (الطالب صاحب الشكوى):</label>
                        <input type="text" id="complaintStudentSearch" 
                               placeholder="اكتب جزء من اسمك..."
                               autocomplete="off"
                               oninput="searchComplaintStudent(this.value)">
                        <div class="complaint-search-results" id="complaintStudentResults"></div>
                    </div>

                    <div class="complaint-group">
                        <label>🎯 ابحث عن اسم الزميل (المشكو في حقه):</label>
                        <input type="text" id="complaintAgainstSearch" 
                               placeholder="اكتب جزء من اسم الزميل..."
                               autocomplete="off"
                               oninput="searchComplaintAgainst(this.value)">
                        <div class="complaint-search-results" id="complaintAgainstResults"></div>
                    </div>

                    <div class="complaint-group">
                        <label>📋 نوع المخالفة:</label>
                        <select id="complaintViolationType">
                            <option value="">اختر نوع المخالفة</option>
                            ${VIOLATIONS_LIST.map(v => `
                                <option value="${v.label}">${v.label}</option>
                            `).join('')}
                        </select>
                    </div>

                    <div class="complaint-group">
                        <label>📝 شرح المشكلة (بحد أقصى 50 حرف):</label>
                        <textarea id="complaintDescription" 
                                  placeholder="اكتب شرحاً موجزاً للمشكلة..."
                                  maxlength="50"
                                  oninput="updateComplaintCounter()"></textarea>
                        <div class="char-counter" id="complaintCharCounter">0 / 50 حرف</div>
                    </div>

                    <button class="whatsapp-submit-btn" onclick="submitComplaintViaWhatsApp()">
                        <span>📱</span>
                        <span>إرسال الشكوى عبر واتساب</span>
                    </button>
                </div>
            `;
        }

        window.searchComplaintStudent = function(query) {
            const results = document.getElementById('complaintStudentResults');
            if (!query.trim() || query.length < 2) {
                results.classList.remove('show');
                return;
            }

            const q = query.trim().toLowerCase();
            const found = studentsCache.filter(s =>
                s.name && s.name.toLowerCase().includes(q)
            ).slice(0, 15);

            if (found.length === 0) {
                results.innerHTML = '<div class="complaint-result-empty">لا توجد نتائج مطابقة</div>';
                results.classList.add('show');
                return;
            }

            results.innerHTML = found.map(s => `
                <div class="complaint-result-item" 
                     onclick="selectComplaintStudent('${s.id}', '${s.name.replace(/'/g, "\\'")}', '${s.class.replace(/'/g, "\\'")}')">
                    <span>${s.name}</span>
                    <span class="tag">${s.class}</span>
                </div>
            `).join('');
            results.classList.add('show');
        };

        window.selectComplaintStudent = function(id, name, className) {
            complaintStudent = { id, name, className };
            document.getElementById('complaintStudentSearch').value = `${name} - ${className}`;
            document.getElementById('complaintStudentResults').classList.remove('show');
            showToast(`✅ تم اختيار: ${name}`, 'info');
        };

        window.searchComplaintAgainst = function(query) {
            const results = document.getElementById('complaintAgainstResults');
            if (!query.trim() || query.length < 2) {
                results.classList.remove('show');
                return;
            }

            const q = query.trim().toLowerCase();
            const found = studentsCache.filter(s =>
                s.name && s.name.toLowerCase().includes(q)
            ).slice(0, 15);

            if (found.length === 0) {
                results.innerHTML = '<div class="complaint-result-empty">لا توجد نتائج مطابقة</div>';
                results.classList.add('show');
                return;
            }

            results.innerHTML = found.map(s => `
                <div class="complaint-result-item" 
                     onclick="selectComplaintAgainst('${s.id}', '${s.name.replace(/'/g, "\\'")}', '${s.class.replace(/'/g, "\\'")}')">
                    <span>${s.name}</span>
                    <span class="tag">${s.class}</span>
                </div>
            `).join('');
            results.classList.add('show');
        };

        window.selectComplaintAgainst = function(id, name, className) {
            complaintAgainst = { id, name, className };
            document.getElementById('complaintAgainstSearch').value = `${name} - ${className}`;
            document.getElementById('complaintAgainstResults').classList.remove('show');
            showToast(`✅ تم اختيار الزميل: ${name}`, 'info');
        };

        window.updateComplaintCounter = function() {
            const text = document.getElementById('complaintDescription').value;
            const counter = document.getElementById('complaintCharCounter');
            counter.textContent = `${text.length} / 50 حرف`;
            if (text.length >= 45) {
                counter.classList.add('over');
            } else {
                counter.classList.remove('over');
            }
        };

        window.submitComplaintViaWhatsApp = function() {
            if (!complaintStudent) {
                showToast('⚠️ ابحث واختر اسمك أولاً', 'error');
                return;
            }
            if (!complaintAgainst) {
                showToast('⚠️ ابحث واختر اسم الزميل المشكو في حقه', 'error');
                return;
            }
            const violationType = document.getElementById('complaintViolationType').value;
            if (!violationType) {
                showToast('⚠️ اختر نوع المخالفة', 'error');
                return;
            }
            const description = document.getElementById('complaintDescription').value.trim();
            if (!description) {
                showToast('⚠️ اكتب شرحاً موجزاً للمشكلة', 'error');
                return;
            }

            const message = 
                `📢 *شكوى في طالب آخر*\n\n` +
                `👤 *صاحب الشكوى:*\n${complaintStudent.name}\n` +
                `📚 *الفصل:* ${complaintStudent.className}\n\n` +
                `🎯 *الزميل المشكو في حقه:*\n${complaintAgainst.name}\n` +
                `📚 *فصله:* ${complaintAgainst.className}\n\n` +
                `📋 *نوع المخالفة:*\n${violationType}\n\n` +
                `📝 *شرح المشكلة:*\n${description}\n\n` +
                `━━━━━━━━━━━━━━━\n` +
                `🕐 ${new Date().toLocaleString('ar-EG')}`;

            const whatsappUrl = `https://wa.me/${WHATSAPP_COMPLAINT_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
            showToast('✅ جاري تحويلك إلى واتساب...', 'info');
        };

        // ============================================================
        // Modal الاستفسار
        // ============================================================
        window.openHelpModal = function() {
            document.getElementById('helpModalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        };

        window.closeHelpModal = function() {
            document.getElementById('helpModalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        };

        window.closeHelpModalOnOverlay = function(event) {
            if (event.target.id === 'helpModalOverlay') closeHelpModal();
        };

        window.submitHelpViaWhatsApp = function() {
            const userName = document.getElementById('helpUserName').value.trim();
            const userMessage = document.getElementById('helpUserMessage').value.trim();

            if (!userMessage) {
                showToast('⚠️ اكتب استفسارك أولاً', 'error');
                return;
            }

            const message = 
                `💬 *استفسار / مشكلة في الموقع*\n\n` +
                (userName ? `👤 *الاسم:* ${userName}\n\n` : '') +
                `📝 *الاستفسار:*\n${userMessage}\n\n` +
                `━━━━━━━━━━━━━━━\n` +
                `🕐 ${new Date().toLocaleString('ar-EG')}`;

            const whatsappUrl = `https://wa.me/${WHATSAPP_HELP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
            showToast('✅ جاري تحويلك إلى واتساب...', 'info');

            setTimeout(() => {
                closeHelpModal();
                document.getElementById('helpUserName').value = '';
                document.getElementById('helpUserMessage').value = '';
                document.getElementById('helpCharCounter').textContent = '0 / 500 حرف';
            }, 800);
        };

        document.addEventListener('input', function(e) {
            if (e.target && e.target.id === 'helpUserMessage') {
                const counter = document.getElementById('helpCharCounter');
                counter.textContent = `${e.target.value.length} / 500 حرف`;
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('helpModalOverlay');
                if (overlay && overlay.classList.contains('show')) {
                    closeHelpModal();
                }
            }
        });

        // ============================================================
        // حالة الخطأ
        // ============================================================
        function renderErrorState(title, code, description, showRetry = false, customBackAction = null) {
            return `
                <div class="error-state">
                    <span class="error-icon">⚠️</span>
                    <div class="error-title">${title}</div>
                    <div class="error-code">${code}</div>
                    <div class="error-desc">${description}</div>
                    ${showRetry ? `
                        <button class="btn-back" onclick="location.reload()" style="margin-top: 10px;">
                            🔄 إعادة المحاولة
                        </button>
                    ` : ''}
                    <button class="btn-back" onclick="${customBackAction || 'goBack()'}" style="margin-top: 10px;">
                        ← رجوع
                    </button>
                </div>
            `;
        }

        // ============================================================
        // التنقل (History API)
        // ============================================================
        window.onpopstate = function(event) {
            if (event.state) {
                switch (event.state.view) {
                    case 'intro':      
                        renderIntroScreen(); 
                        break;
                    case 'grade':      
                        if (event.state.grade) currentGrade = event.state.grade;
                        renderGradeView(currentGrade || 'الإعدادي'); 
                        break;
                    case 'class':      
                        renderClassView(event.state.className); 
                        break;
                    case 'report':     
                        renderReportView(event.state.studentId); 
                        break;
                    case 'schedule':   
                        renderScheduleView(event.state.className); 
                        break;
                    case 'alerts':     
                        renderAlertsView(event.state.className); 
                        break;
                    case 'violations': 
                        renderViolationsView(); 
                        break;
                    case 'complaint':  
                        renderComplaintView(); 
                        break;
                    default:           
                        renderIntroScreen();
                }
            } else {
                renderIntroScreen();
            }
        };

        // ============================================================
        // منع الزوم
        // ============================================================
        function preventZoom() {
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturestart', (e) => e.preventDefault());
            document.addEventListener('gesturechange', (e) => e.preventDefault());
            document.addEventListener('gestureend', (e) => e.preventDefault());

            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) e.preventDefault();
                lastTouchEnd = now;
            }, { passive: false });

            document.addEventListener('wheel', (e) => {
                if (e.ctrlKey) e.preventDefault();
            }, { passive: false });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && 
                    (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
                    e.preventDefault();
                }
            });
        }

        // ============================================================
        // الاستماع الفوري للبيانات من Firebase
        // ============================================================
        function listenToDatabase() {
            console.log('🔌 بدء الاستماع لقاعدة البيانات...');
            console.log('📦 المشروع:', firebaseConfig.projectId);

            // 1️⃣ الطلاب (students)
            onSnapshot(collection(db, 'students'), (snapshot) => {
                studentsCache = [];
                snapshot.forEach(docSnap => {
                    studentsCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                isDataLoaded = true;
                dataLoadError = null;
                console.log(`✅ تم تحميل ${studentsCache.length} طالب`);

                refreshCurrentView();
            }, (error) => {
                console.error('❌ خطأ في تحميل الطلاب:', error);
                dataLoadError = error;
                isDataLoaded = true;
                refreshCurrentView();
            });

            // 2️⃣ الجداول (schedules)
            onSnapshot(collection(db, 'schedules'), (snapshot) => {
                schedulesCache = {};
                snapshot.forEach(docSnap => {
                    schedulesCache[docSnap.id] = { id: docSnap.id, ...docSnap.data() };
                });
                console.log(`✅ تم تحميل ${Object.keys(schedulesCache).length} جدول`);

                if (currentView === 'schedule' && currentClass) {
                    renderScheduleView(currentClass);
                }
            }, (error) => {
                console.error('❌ خطأ في تحميل الجداول:', error);
            });

            // 3️⃣ التنبيهات (alerts)
            onSnapshot(collection(db, 'alerts'), (snapshot) => {
                alertsCache = [];
                snapshot.forEach(docSnap => {
                    alertsCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                console.log(`✅ تم تحميل ${alertsCache.length} تنبيه`);

                if (currentView === 'alerts' && currentClass) {
                    renderAlertsView(currentClass);
                }
            }, (error) => {
                console.error('❌ خطأ في تحميل التنبيهات:', error);
            });
        }

        // إعادة رسم الشاشة الحالية
        function refreshCurrentView() {
            switch (currentView) {
                case 'intro':      
                    renderIntroScreen(); 
                    break;
                case 'grade':      
                    renderGradeView(currentGrade || 'الإعدادي'); 
                    break;
                case 'class':      
                    if (currentClass) renderClassView(currentClass); 
                    break;
                case 'report':     
                    if (currentStudentId) renderReportView(currentStudentId); 
                    break;
                case 'schedule':   
                    if (currentClass) renderScheduleView(currentClass); 
                    break;
                case 'alerts':     
                    if (currentClass) renderAlertsView(currentClass); 
                    break;
                case 'violations': 
                    renderViolationsView(); 
                    break;
                case 'complaint':  
                    renderComplaintView(); 
                    break;
                default:           
                    renderIntroScreen();
            }
        }

        // ============================================================
        // التهيئة
        // ============================================================
        preventZoom();
        history.replaceState({ view: 'intro' }, '', ' ');
        renderIntroScreen();
        listenToDatabase();

    </script>
</body>
</html>
